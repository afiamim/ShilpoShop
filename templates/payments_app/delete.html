{% extends 'base.html' %}
{% block title %}Delete Payment - ShilpoShop{% endblock %}
{% block content %}
<div class="confirm-box">
    <h2>Delete Payment</h2>
    <p>Are you sure you want to delete this payment record?</p>
    <form method="POST">
        {% csrf_token %}
        <div class="flex gap-1">
            <button type="submit" class="btn btn-red">Yes, Delete</button>
            <a href="{% url 'payment_list' %}" class="btn btn-gray">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
